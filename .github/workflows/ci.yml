name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every release declared compatible in `dsh.compatibility.dshReleases`.
        dsh: ['0.1.5-rc.2', '0.1.6-alpha.1', '0.1.6-alpha.2']
    name: test (dsh ${{ matrix.dsh }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pin the harness packages to ${{ matrix.dsh }}
        run: node scripts/pin-dsh.mjs ${{ matrix.dsh }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
